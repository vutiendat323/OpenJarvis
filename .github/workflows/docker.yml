name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openjarvis

jobs:
  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy - committed secrets (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          skip-dirs: tests
          exit-code: "1"
      # Report-only: existing lockfile CVEs are tracked in the Security tab;
      # the image gate below is what blocks shipping.
      - name: Trivy - lockfile CVEs (report)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-repo.sarif
      - if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@c23de5a82f64bb08c6d9f28844551440ca298e76 # v4.38.1
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

  image:
    needs: scan-repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: openjarvis:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - image gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: openjarvis:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Compose smoke test (jarvis + ollama, /health)
        env:
          OPENJARVIS_IMAGE: openjarvis:scan
          OPENJARVIS_API_KEY: ci-smoke-key
        run: |
          compose="docker compose -f deploy/docker/docker-compose.yml"
          $compose up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit_code=0 && break
            exit_code=1; sleep 2
          done
          [ "$exit_code" = 0 ] || $compose logs
          $compose down -v
          exit $exit_code

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild is a full cache hit; pushing only after the scan passes.
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
