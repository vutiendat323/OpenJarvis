[skill]
name = "trendcoffee-menu"
description = "Read the complete live menu. Classify each customer search semantically in the current turn: itemTerms match product names/descriptions and categoryTerms match category labels. Choose categoryTerms from runtime_context.menu_categories when present, expanding broad concepts to relevant exact live labels. Use content-word phrases without conjunctions and split independent concepts into separate terms. Use displayMode='browse' with both term arrays empty and the full price range only for the complete menu."
required_capabilities = ["network:fetch"]
input_schema_json = '''
{
  "type":"object",
  "properties":{
    "itemTerms":{"type":"array","items":{"type":"string","minLength":1}},
    "categoryTerms":{"type":"array","items":{"type":"string","minLength":1}},
    "minPrice":{"type":"integer","minimum":0},
    "maxPrice":{"type":"integer","minimum":0},
    "displayMode":{"type":"string","enum":["browse","filtered"]}
  },
  "required":["itemTerms","categoryTerms","minPrice","maxPrice","displayMode"],
  "additionalProperties":false
}
'''

[skill.metadata.openjarvis.request_recipe]
origin = "https://trendcoffee.net"
method = "GET"
read_only = true
captured_from = "browser_network_requests"
allowed_content_types = ["application/json"]
required_paths_json = '''[{"path":"result.items","type":"array"},{"path":"result.hasNext","type":"boolean"}]'''

[skill.metadata.openjarvis.initial_display]
inputs = { itemTerms = [], categoryTerms = [], minPrice = 0, maxPrice = 1000000000, displayMode = "browse" }

# The endpoint ignores q/query/search/keyword, so all requested filters are
# applied locally over one complete read. This preserves a full live catalog
# for the left column while the right column receives exact filtered results.
# A short timeout turns a stalled provider into source_unavailable quickly.
# Photos go through the site file API: direct S3 object URLs return 403.
[[skill.steps]]
tool_name = "http_request"
output_key = "menu"
arguments_template = '''{"url":"https://trendcoffee.net/api/latest/menu/specific/public?date={today|urlencode}&branch=ba9355f797&catalog=&minPrice=0&maxPrice=1000000000&size=200&hasPaging=true&page=1","method":"GET","timeout":5}'''
assertions_json = '''[{"actual":"{menu.result.hasNext}","equals":false},{"actual":{"$map":"{menu.result.items.0.menuItems}","as":"entry","value":"{entry.product.variants.0.slug}"},"all_unique_non_empty":true}]'''

[[skill.steps]]
tool_name = "display_menu"
arguments_template = '''{"items":{"$map":{"$filter":"{menu.result.items.0.menuItems}","as":"entry","where":{"all":[{"any":[{"equals":["{displayMode}","browse"]},{"search_matches":["{entry.product.name}","{itemTerms}"]},{"search_matches":["{entry.product.description}","{itemTerms}"]},{"search_matches":["{entry.product.catalog.name}","{categoryTerms}"]}]},{"gte":["{entry.product.variants.0.price}","{minPrice}"]},{"lte":["{entry.product.variants.0.price}","{maxPrice}"]}]}},"as":"entry","value":{"id":"{entry.product.variants.0.slug}","name":"{entry.product.name}","price":"{entry.product.variants.0.price}","available":"{entry.product.isActive}"}},"menu_items":{"$map":"{menu.result.items.0.menuItems}","as":"entry","value":{"id":"{entry.product.variants.0.slug}","name":"{entry.product.name}","price":"{entry.product.variants.0.price}","available":"{entry.product.isActive}","category":"{entry.product.catalog.name}","is_top_sell":"{entry.product.isTopSell}","is_new":"{entry.product.isNew}","note":{"$coalesce":["{entry.product.description}",""]},"image_url":{"$coalesce":["https://trendcoffee.net/api/latest/file/{entry.product.image|urlencode}",""]},"variants":{"$map":"{entry.product.variants}","as":"variant","value":{"id":"{variant.slug}","size":{"$coalesce":["{variant.size.name}",""]},"price":"{variant.price}"}}}},"display_mode":"{displayMode}","result_complete":true}'''
