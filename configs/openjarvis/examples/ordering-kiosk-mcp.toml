# ordering-kiosk-mcp.toml -- ordering kiosk with a local customer display.
#
# Playwright remains connected so PresentationSessionManager can own the
# customer-display tab. The ordering Agent uses prepared merchant skills;
# Playwright tools are not exposed to it.

# Ordering Kiosk — Trend Coffee-backed voice ordering, Phase 1.
#
# Text and Voice reach the same orchestrator Agent. Prepared skills perform
# validated merchant reads and guarded checkout; local draft tools update the
# customer display. See configs/openjarvis/prompts/ordering-kiosk.md.
#
# Eight turns cover the measured order flow while bounding a malformed tool-call
# loop before it burns another six-figure token total.
#
# Usage:
#   OPENJARVIS_CONFIG=configs/openjarvis/examples/ordering-kiosk-mcp.toml jarvis serve

[engine]
default = "ollama"

[intelligence]
default_model = "qwen3.5:9b"        # needs reliable function calling
# The default 1024 is one budget shared by the model's chain-of-thought AND the
# tool call that follows it. A reasoning model spends most of 1024 thinking, so
# the tool call is emitted truncated: the JSON stops mid-argument, no parser can
# read it, and the fragment either leaks into the reply as raw markup or leaves
# the turn with nothing to say ("No response was generated"). Measured: every
# failing turn stopped at exactly 1024 output tokens, while an order body is
# only ~130 tokens. This is per inference call, not per turn.
max_tokens = 4096
# `scripts/launcher.sh` passes `--engine cloud --model "$MODEL"`, overriding
# both keys above. Its default is gpt-6-luna via direct OpenAI; select another
# cloud model with OPENJARVIS_MODEL. The local ollama target above has not yet
# been exercised end to end.

[agent]
default_agent = "orchestrator"
system_prompt_path = "configs/openjarvis/prompts/ordering-kiosk.md"
max_turns = 8
context_from_memory = true
intent_normalization = true
# Each tool call carries `_progress`, a short clause the model writes from the
# request; it is spoken while the turn's tools run (see agents/orchestrator.py).
progress_speech = true
# A round that is only reasoning after this many seconds is retried with
# reasoning off (engines that can; see agents/orchestrator.py).
# 2026-10-13: 8 -> 3. deepseek-flash reasons ~680 chars/s; 4/58 rounds hit 8 s
# (5,099-5,834 chars), and 14/44 finished rounds reasoned past ~2,100 chars, so
# about a third of rounds now answer without reasoning after 3 s.
reasoning_deadline_seconds = 3.0
# Flipped to true deliberately, with the cost understood. Read the whole note
# before flipping it back or leaving it.
#
# What it buys, measured: three catalogue reads in one batch took 0.23 + 0.25 +
# 0.31s sequentially; run together that is 0.31s. About 0.5s on a turn that
# takes 15-25s -- roughly 2%. The expensive part of a turn is the model
# thinking for 4-8s between decisions, and parallel dispatch does not touch it.
#
# What it costs: `parallel_tools` is one boolean over every tool call in a
# batch (orchestrator.py:620 -- there is no read/write filter). The doctrine
# "one tool call = one mutation or one observation, never both" only holds while
# calls run one at a time. With this true, a single batch may carry
# `POST /orders/public` alongside `GET /orders/{slug}`, reading an order before
# it exists, or alongside `POST /payment/initiate/public`, paying for one that
# was never created. The evidence-store fingerprint refuses two *identical*
# mutations, so a duplicated order is still blocked; two *different* mutations
# in one batch are not.
#
# This preset points at a real shop with real money. The owner chose this
# trade after being shown both numbers.
parallel_tools = true

[tools]
# The five display_* tools drive the React `/customer-display` route through
# the WebSocket bridge and are unrelated to the Data Plane; they stay enabled.
# Playwright stays connected for presentation, outside the ordering Agent.
# Luna handles menu choices directly; typesafe_decide stays internal.
# `repl` stays absent (ruling R9: in-process object-graph escape).
enabled = "http_request,skill_manage,typesafe_decide,display_menu,display_cart,display_bill,display_payment_qr,display_clear"
# Prepared procedures retain these primitives in their internal executor.
# The Agent sees menu/cart/clear and active merchant skills.
model_hidden = "http_request,skill_manage,typesafe_decide,display_bill,display_payment_qr"
# Only this origin may supply a payment QR. Empty would mean no QR can ever be
# displayed; a wide list would mean the guard proves nothing.
payment_trusted_origins = "https://trendcoffee.net"

[tools.storage]
# Curated public FAQ only. Isolated from personal/global memory databases.
default_backend = "sqlite"
db_path = "~/.openjarvis/trendcoffee-rag.db"
context_top_k = 3
context_min_score = 0.0
context_max_tokens = 800
enabled = false  # automatic personal-fact extraction remains off

[sessions]
# Retain logs for inspection; voice context still starts fresh for each customer.
enabled = true

[security]
# Verified public business contacts from the curated corpus. All other PII,
# card numbers and secrets retain normal redaction; no role/message bypass.
public_contact_values = ["0886128008", "0367820500", "0945867620", "trend.coffee.tea@gmail.com"]

[skills]
# Expose only this merchant's prepared menu and guarded checkout procedures.
# Learned procedures remain available to skill_manage's internal executor.
enabled = true
active = "trendcoffee-menu,trendcoffee-tables,trendcoffee-add-to-cart,trendcoffee-checkout"

[workflow]
# Skills run their steps through WorkflowEngine: independent GET/HEAD reads
# share a stage (checkout reads menu and tables together); every write and
# display keeps its manifest order. No agent or LLM node is ever created.
# false restores strictly sequential steps.
enabled = true

[learning]
# A completed, verified transaction becomes a replayable skill in this same
# process. `training_enabled` stays false: this preset learns procedures, it
# does not fine-tune a model.
enabled = true
auto_update = true
training_enabled = false

[server]
host = "127.0.0.1"
port = 8000
agent = "orchestrator"

[voice.stt]
# Applied when each Voice session connects. Keep recognition Vietnamese.
# Hint only common Vietnamese dining choices and necessary foreign menu/kiosk
# terms; avoid transliterations and English navigation/order commands.
language_codes = ["vi-VN"]
mode = "VERBATIM"
custom_vocabulary = [
  "mang đi",
  "mang về",
  "tại bàn",
  "menu",
  "Yaourt",
  "Lipton",
  "Americano",
  "Espresso",
  "Latte",
  "Affogato",
  "Cold Brew",
  "Cold Brew Original",
  "Matcha",
  "Choco latte",
  "Chocolate Coco",
  "Strawberry matcha latte",
  "Croissant",
  "Croissant Ham & Cheese",
  "Matcha ribbon croissant",
  "Salted egg charcoal croissant",
  "Tiramisu",
  "Pain suisse",
  "Cinnamon rolls",
]

[voice.responder]
# A fast model speaks one neutral acknowledgement while the Agent's first round
# reasons and calls tools (OpenAI's chat-supervisor/preamble pattern). Measured
# 2026-10-13 on synthetic Vietnamese requests, full line: gpt-6-luna p50 2.72 s,
# p90 3.63 s, 16/16 correct skips (it reasons at the launcher's effort; there is
# no switch to turn that off). deepseek-flash (thinking off) p50 0.73 s but
# 15/24 skips; gemini-flash-lite-latest p50 0.99 s, 24/24. Live deepseek-flash
# 14:01-14:06: p50 0.93 s; live gpt-6-luna 14:20-14:26: p50 2.20 s, 5/14 too
# late. Chosen: deepseek-flash, the fastest and cheapest (thinking is turned off
# through the engine's reasoning_off_options). With the prompt that names the
# customer's request: p50 0.84 s, p90 0.99 s, 22/24 skips, 0/24 register slips.
# Empty disables it. Applied when each Voice session connects.
model = "deepseek-flash"
# What the acknowledgement may say is this business's wording, so it lives in a
# file like the Agent's prompt. Read at each session; unset uses the generic
# built-in prompt.
prompt_file = "configs/openjarvis/prompts/voice-responder.md"

[voice.speaker]
# Target-speaker gate (docs spec 2026-09-25). Off until a diarizer ships:
# with no speaker evidence every turn is accepted, exactly as before. An
# UNCERTAIN turn acts without asking; only a REJECTed turn that still
# reaches the Agent is limited to these tools. Allow read-only skills only:
# an allowed skill runs its own fixed steps.
enabled = true
uncertain_allowed_tools = ["display_menu", "skill_trendcoffee-menu", "skill_trendcoffee-tables"]
# "sortformer" needs the voice-speaker extra and a CUDA GPU (~1 GB VRAM).
diarizer = "sortformer"
diarizer_latency = "ultra_low"
# "rnnoise" needs the voice-enhancement extra.
enhancer = "rnnoise"
# Accept speech only while the nearest face within 1.5 m moves its mouth
# (Vision `faces` stream); speech with that mouth still is rejected.
vision_faces = true
# Mirror post-enhancer mic PCM to Vision's optional Light-ASD model.
vision_asd = true
asd_accept_prob = 0.7
# 0.0: ASD is positive evidence only. Held-out 2026-09-29: it misreads 88% of
# silent head motion as speech, and as a veto (0.3) it cut the customer's own
# replies in trial A. A low score never REJECTs; MAR decides.
asd_reject_prob = 0.0
asd_wait_secs = 0.12
# Send Gemini a speaker-gated copy of the mic with rejected speech silenced,
# so a phone video or bystander never lands in the customer's transcript.
stt_mask = true
# Fusion sends audio as soon as verdicts cover it. Keep a 0.7 s deadline for
# missing evidence: ASD can wait up to asd_wait_secs before deciding a row.
stt_mask_delay_secs = 0.7
# "tse" (needs stt_mask): hold overlapped speech back from Gemini and send
# the customer's voice extracted from it. Export the model first with
# scripts/voice_tse_export.py (~0.7 GB VRAM). Experimental: overlap stays
# UNCERTAIN either way.
separator = "tse"
# Lock one customer per kiosk session (spec 2026-09-30): Light-ASD confirms a
# face and a diarizer slot together, a TitaNet voiceprint follows them when
# they look away, and nobody else's speech reaches STT, opens a turn or
# barges in. Thresholds are starting values, tuned from live-trial logs.
identity = "fusion"
anchor_max_m = 1.5
mouth_active = 0.5
voice_match = 0.85
voice_reject = 0.45
bot_match = 0.7

[tools.mcp]
enabled = true
servers = '''[{"name": "playwright", "command": "npx", "args": ["-y", "@playwright/mcp@0.0.79", "--browser", "chromium", "--user-data-dir", ".openjarvis/ordering-kiosk/browser-profile", "--sandbox", "--caps=testing", "--snapshot-mode", "none"], "presentation_only": true}]'''

[kiosk]
approach_threshold_m = 1.0
approach_entry_debounce = 5.0
approach_sustain_seconds = 5.0
leave_sustain_seconds_active = 10.0
session_max_seconds = 600.0
leave_sustain_seconds_prompting = 5.0
popup_timeout = 30.0
decline_cooldown_seconds = 10.0
tts_voice = "Mai Anh"
